name: Hourly Stock Check

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  stock-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hourly Stock Auditor
        run: |
          if [ -z "${{ secrets.REAVO_APP_URL }}" ]; then
            echo "::error::REAVO_APP_URL secret is not configured in GitHub repository secrets."
            exit 1
          fi

          APP_URL=$(echo "${{ secrets.REAVO_APP_URL }}" | sed 's:/*$::')
          TARGET_URL="${APP_URL}/api/cron/hourly-stock"
          echo "Triggering hourly stock auditor at $TARGET_URL..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$TARGET_URL" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Hourly stock audit completed successfully."
          else
            echo "::error::Hourly stock audit failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
